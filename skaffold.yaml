# =============================================================================
# skaffold.yaml — local Kubernetes dev orchestration for the ticketing system
# =============================================================================
#
# WHAT SKAFFOLD DOES FOR US
# -------------------------
# `skaffold dev` watches source files, rebuilds the affected container image(s),
# redeploys the Kubernetes manifests under infra/k8s, and streams logs — giving
# us a hot-reload loop across a *multi-service* cluster. It is the single command
# that stands the whole system up on the local Docker Desktop Kubernetes cluster.
#
# TWO REBUILD STRATEGIES, COMBINED
# --------------------------------
#   1. Image rebuild  — when a file OUTSIDE the `sync` rules changes (e.g.
#      package.json), Skaffold rebuilds the Docker image and redeploys the pod.
#   2. File sync      — when a file matching a `sync` rule changes (our .ts/.js
#      source), Skaffold copies the file straight into the running container
#      instead of rebuilding. Combined with ts-node-dev's `--poll` inside the
#      container, edits reflect in ~1s without an image rebuild. This is why
#      each service's dev command uses ts-node-dev with polling.
#
# IMAGE NAMING
# ------------
# Images are prefixed `456738/` (Omar's Docker Hub namespace). `push: false`
# keeps images local — Docker Desktop's Kubernetes shares the daemon's image
# store, so there is no registry round-trip in dev.
#
# NOTE ON MIGRATION STATE
# -----------------------
# During the NATS->Kafka and Mongo->Postgres migration, every artifact below
# still points at the pre-migration service source. Each service is migrated in
# its own phase; this file's artifact list is stable across those phases because
# only the *contents* of each service change, not its build wiring.
# =============================================================================

apiVersion: skaffold/v4beta11
kind: Config

manifests:
  rawYaml:
    # Glob every manifest in infra/k8s. Ordering is not significant for our
    # resources (Deployments/StatefulSets/Services reconcile independently).
    - infra/k8s/*

deploy:
  kubectl: {}

build:
  local:
    # Do not push to a remote registry; Docker Desktop's k8s reads the local
    # daemon image store directly.
    push: false
  artifacts:
    # Backend services share `common/` + `schemas/`, which live OUTSIDE each
    # service dir. So their build context is the REPO ROOT (context: .) and each
    # Dockerfile lives at <service>/Dockerfile. File sync keeps the <service>/
    # path prefix so synced files land in the right place inside the image.

    # ---- auth: user accounts, signup/signin, JWT issuance ------------------
    - image: 456738/auth
      context: .
      docker:
        dockerfile: auth/Dockerfile
      sync:
        manual:
          - src: 'auth/src/**/*.ts'
            dest: .

    # ---- tickets: create/list/update tickets, source of ticket:* events ----
    - image: 456738/tickets
      context: .
      docker:
        dockerfile: tickets/Dockerfile
      sync:
        manual:
          - src: 'tickets/src/**/*.ts'
            dest: .

    # ---- orders: order lifecycle, saga initiator (order:* events) ----------
    - image: 456738/orders
      context: .
      docker:
        dockerfile: orders/Dockerfile
      sync:
        manual:
          - src: 'orders/src/**/*.ts'
            dest: .

    # ---- expiration: Bull/Redis delayed job -> expiration:complete ---------
    - image: 456738/expiration
      context: .
      docker:
        dockerfile: expiration/Dockerfile
      sync:
        manual:
          - src: 'expiration/src/**/*.ts'
            dest: .

    # ---- payments: Stripe charge, payment:created --------------------------
    - image: 456738/payments
      context: .
      docker:
        dockerfile: payments/Dockerfile
      sync:
        manual:
          - src: 'payments/src/**/*.ts'
            dest: .

    # ---- client: Vite/React SPA served by nginx (own context; no shared deps).
    # No file sync: the SPA is a static build, so source changes require an image
    # rebuild (Skaffold does this automatically on change). For fast UI iteration,
    # run `npm run dev` in client/ directly against a port-forwarded ingress.
    # The Stripe PUBLISHABLE key must be passed at BUILD time: Vite inlines
    # VITE_* vars into the bundle, so it cannot be injected later as a pod env
    # var like the backend secrets are. Without this, the image falls back to
    # `pk_test_placeholder` and Stripe.js cannot tokenize a card — the payment
    # form fails in the browser with no server-side error.
    #
    # Set it in your shell before `skaffold dev`:
    #   export VITE_STRIPE_PUBLISHABLE_KEY=pk_test_...   (bash)
    #   $env:VITE_STRIPE_PUBLISHABLE_KEY = "pk_test_..." (PowerShell)
    - image: 456738/client
      context: client
      docker:
        dockerfile: Dockerfile
        buildArgs:
          VITE_STRIPE_PUBLISHABLE_KEY: '{{.VITE_STRIPE_PUBLISHABLE_KEY}}'
