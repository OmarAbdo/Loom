apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tickets
  template:
    metadata:
      labels:
        app: tickets
    spec:
      containers:
        - name: tickets
          image: 456738/tickets
          ports:
            - containerPort: 3000
          env:
            # Stable per-pod client id (used as Kafka clientId). Derived from the
            # pod name so each replica is distinguishable, as NATS_CLIENT_ID was.
            - name: KAFKA_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Broker bootstrap address (the KRaft broker's PLAINTEXT listener).
            - name: KAFKA_BROKERS
              value: 'kafka-0.kafka-srv:9092'
            # Consumer group id for this service's listeners (competing consumers).
            - name: KAFKA_GROUP_ID
              value: 'tickets'
            # Schema Registry endpoint for Avro serdes.
            - name: SCHEMA_REGISTRY_URL
              value: 'http://schema-registry-srv:8081'
            # Postgres connection (ADR-0003). POSTGRES_PASSWORD is sourced from
            # a Secret and interpolated into DATABASE_URL via $(...) expansion,
            # so no credential is hardcoded in the manifest.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: 'postgresql://tickets:$(POSTGRES_PASSWORD)@tickets-postgres-srv:5432/tickets'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-srv
spec:
  selector:
    app: tickets
  ports:
    - name: tickets
      protocol: TCP
      port: 3000
      targetPort: 3000
