apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: 456738/client
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: client-srv
spec:
  selector:
    app: client
  ports:
    - name: client
      protocol: TCP
      # Service port stays 3000 (the ingress backend references it), but nginx
      # listens on 80 inside the container, so targetPort is 80.
      port: 3000
      targetPort: 80
