# nginx config for serving the SPA.
# The try_files fallback to /index.html is essential for a client-side router:
# a hard refresh on /orders/<id> must return index.html (not 404) so React
# Router can handle the path in the browser.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Build redirects from the Host header rather than nginx's server_name/port.
  # Without this, the `/docs` -> `/docs/` redirect below emits an absolute URL
  # that drops the port (http://localhost/docs/), which breaks a port-forwarded
  # cluster (https://localhost:8443). Off = use the request's own Host and
  # scheme, which is also what keeps redirects correct behind the ingress.
  absolute_redirect off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Aggregated API docs (public/docs/index.html, copied to dist by Vite).
  #
  # This block exists because of the SPA fallback above: `/docs` with no
  # trailing slash matches neither $uri nor $uri/, so it would fall through to
  # /index.html and render the React app's 404 instead of the docs page. The
  # redirect normalises it to /docs/, which then resolves to the real file.
  location = /docs {
    return 301 /docs/;
  }

  location /docs/ {
    try_files $uri $uri/index.html =404;
  }
}
